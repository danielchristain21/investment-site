<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Global Trust Fund</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111F;
      color: #FFFFFF;
      min-height: 100vh;
    }

    header {
      background: #0D1B2A;
      border-bottom: 1px solid #203246;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #D4AF37;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      color: #FFFFFF;
      background: transparent;
      border: 1px solid #D4AF37;
      border-radius: 7px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout:hover {
      background: #D4AF37;
      color: #07111F;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #B8C4D4;
    }

    .balance-card {
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 25px;
    }

    .balance-label {
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .balance {
      color: #D4AF37;
      font-size: 42px;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 12px;
      padding: 24px;
    }

    .card h3 {
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 21px;
      font-weight: bold;
    }

    .section {
      margin-top: 30px;
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 21px;
    }

    .activity {
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 12px;
      padding: 20px;
      color: #B8C4D4;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .balance {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Global Trust Fund</div>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <main class="container">

    <div class="welcome">
      <h1>Welcome, <span id="userName">User</span></h1>
      <p>Here's an overview of your account.</p>
    </div>

    <div class="balance-card">
      <div class="balance-label">Account Balance</div>
      <div class="balance">$14,000.00</div>
    </div>

    <div class="cards">

      <div class="card">
        <h3>Account Status</h3>
        <p>Active</p>
      </div>

      <div class="card">
        <h3>Investment Plan</h3>
        <p>Standard</p>
      </div>

      <div class="card">
        <h3>Account Currency</h3>
        <p>USD</p>
      </div>

    </div>

    <div class="section">
      <h2>Recent Activity</h2>

      <div class="activity">
        No recent activity to display.
      </div>
    </div>

  </main>

  <script>
    const loggedIn = localStorage.getItem("gtf_logged_in");

    if (loggedIn !== "true") {
      window.location.href = "login.html";
    }

    const userName = localStorage.getItem("gtf_user_name");

    if (userName) {
      document.getElementById("userName").textContent = userName;
    }

    function logout() {
      localStorage.removeItem("gtf_logged_in");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
